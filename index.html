<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <title>Fuzzy & Crochet Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <!-- Menu Button -->
    <span class="menu-icon" onclick="openMenu()">☰</span>

    <!-- Side Menu -->
    <div id="sideMenu" class="side-menu">
      <a href="javascript:void(0)" class="closebtn" onclick="closeMenu()">&times;</a>
      <a href="index.html">Home</a>
      <a href="crochet.html">Crochet Items</a>
      <a href="fuzzy.html">Fuzzy Wires</a>
      <a href="custom.html">Custom Order</a>
      <a href="cart.html">Cart 🛒</a>
    </div>

    <h1>Whimsy Workshop</h1>
    <!-- <nav>
      <a href="index.html" class="active">Home</a>
      <a href="cart.html">Cart 🛒</a> -->
  </header>

  <!-- Product Grid (Dynamic) -->
  <main class="product-grid" id="product-grid">
    <!-- Products will be loaded here dynamically from backend -->
  </main>

  <footer>
    <p>© 2025 Mini Shop | Handmade with 💖</p>
  </footer>
  <div id="main-overlay" onclick="closeMenu()"></div>

  <script>
    // --- MENU FUNCTIONS ---
    function openMenu() {
        document.getElementById("sideMenu").style.width = "250px";
        document.getElementById("main-overlay").style.display = "block";
    }
    function closeMenu() {
        document.getElementById("sideMenu").style.width = "0";
        document.getElementById("main-overlay").style.display = "none";
    }

    // --- ADD TO CART FUNCTION ---
    function addToCart(product) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let found = cart.find(item => item.id == product.id);

        if (found) {
            found.quantity += 1;
        } else {
            cart.push({ ...product, quantity: 1 });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        alert(product.name + " added to cart!");
    }

    // --- LOAD PRODUCTS FROM BACKEND ---
    async function loadProducts() {
        try {
            const response = await fetch("http://localhost/whimsyshop/api.php?action=products");
            const products = await response.json();

            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            products.forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";

                // Optional: show image if product.image exists
                const imgHTML = product.image ? `<img src="${product.image}" alt="${product.name}">` : "";

                card.innerHTML = `
                    ${imgHTML}
                    <h3>${product.name}</h3>
                    <p class="price">Rs. ${product.price}</p>
                    <p class="desc">${product.description}</p>
                    <button class="add-to-cart"
                        data-id="${product.id}"
                        data-name="${product.name}"
                        data-price="${product.price}"
                        data-image="${product.image || ''}">
                        Add to Cart
                    </button>
                `;
                grid.appendChild(card);
            });

            // Attach Add to Cart listeners
            document.querySelectorAll(".add-to-cart").forEach(btn => {
                btn.addEventListener("click", () => {
                    const product = {
                        id: btn.dataset.id,
                        name: btn.dataset.name,
                        price: Number(btn.dataset.price),
                        image: btn.dataset.image
                    };
                    addToCart(product);
                });
            });

        } catch (err) {
            console.error("Failed to load products:", err);
        }
    }

    // Load products on page load
    loadProducts();
  </script>
</body>
</html>
