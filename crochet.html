<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <title>Crochet Items | Whimsy Workshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <!-- Menu Button -->
  <span class="menu-icon" onclick="openMenu()">☰</span>

  <!-- Side Menu -->
  <div id="sideMenu" class="side-menu">
    <a href="javascript:void(0)" class="closebtn" onclick="closeMenu()">&times;</a>
    <a href="index.html">Home</a>
    <a href="crochet.html" class="active">Crochet Items</a>
    <a href="fuzzy.html">Fuzzy Wires</a>
    <a href="custom.html">Custom Order</a>
    <a href="cart.html">Cart 🛒</a>
  </div>

  <h1>Crochet Items</h1>
  <!-- <nav>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart 🛒</a>
  </nav> -->
</header>

<!-- Product Grid -->
<main class="product-grid" id="product-grid"></main>

<footer>
  <p>© 2025 Mini Shop | Handmade with 💖</p>
</footer>
<div id="main-overlay" onclick="closeMenu()"></div>


<script>
/* ---------------- MENU ---------------- */
function openMenu() {
  document.getElementById("sideMenu").style.width = "250px";
  document.getElementById("main-overlay").style.display = "block";
}
function closeMenu() {
  document.getElementById("sideMenu").style.width = "0";
  document.getElementById("main-overlay").style.display = "none";
}

/* ---------------- CART FUNCTION ---------------- */
function addToCart(product) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let found = cart.find(item => item.id == product.id);

  if (found) {
    found.quantity += 1;
  } else {
    cart.push({ ...product, quantity: 1 });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert(product.name + " added to cart!");
}

/* ---------------- CROCHET PRODUCT LIST ---------------- */
const crochetProducts = [
  { id: 101, name: "Tulip Bouquet", price: 1500, image: "images/crochet_flower.jpg", description: "Handmade crochet tulips." },
  { id: 102, name: "Kuromi Plushie", price: 1800, image: "images/kuromi.jpg", description: "Soft crocheted Kuromi doll." },

  // Your new items
  { id: 103, name: "Crocheted Bag", price: 15000, image: "images/bag.jpg", description: "Handmade crochet shoulder bag." },
  { id: 104, name: "Ghost Charm", price: 300, image: "images/ghost charm.jpg", description: "Cute tiny ghost charm keychain." },
  { id: 105, name: "Mini Owl Plushie", price: 2000, image: "images/owl.jpg", description: "Adorable handmade small owl." },
  { id: 106, name: "Mini Penguin Plushie", price: 2000, image: "images/penguin.jpg", description: "Cute tiny penguin plushie." },
  { id: 107, name: "Owl + Penguin Combo", price: 3600, image: "images/penandowl.jpg", description: "Owl + Penguin handmade bundle." },
  { id: 108, name: "Rose Keychain", price: 300, image: "images/roses.jpg", description: "Crocheted rose keychain." },
  { id: 109, name: "Miffy Pocket", price: 500, image: "images/miffy.jpg", description: "Small crocheted Miffy pocket." }
];

/* --------------- LOAD CROCHET PRODUCTS --------------- */
function loadCrochetProducts() {
  const grid = document.getElementById("product-grid");
  grid.innerHTML = "";

  crochetProducts.forEach(product => {
    const card = document.createElement("div");
    card.className = "product-card";

    const imgHTML = product.image ? `<img src="${product.image}" alt="${product.name}">` : "";

    card.innerHTML = `
      ${imgHTML}
      <h3>${product.name}</h3>
      <p class="price">Rs. ${product.price}</p>
      <p class="desc">${product.description}</p>
      <button class="add-to-cart"
          data-id="${product.id}"
          data-name="${product.name}"
          data-price="${product.price}"
          data-image="${product.image}">
          Add to Cart
      </button>
    `;
    grid.appendChild(card);
  });

  // Add listeners
  document.querySelectorAll(".add-to-cart").forEach(btn => {
    btn.addEventListener("click", () => {
      const product = {
        id: btn.dataset.id,
        name: btn.dataset.name,
        price: Number(btn.dataset.price),
        image: btn.dataset.image
      };
      addToCart(product);
    });
  });
}

// Load products on page open
loadCrochetProducts();
</script>

</body>
</html>
